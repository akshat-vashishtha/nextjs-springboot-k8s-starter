server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: user-service

  data:
    mongodb:
      uri: mongodb://localhost:27017/user_db
      auto-index-creation: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
